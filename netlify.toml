# LidlVM — configuration Netlify
# Projet maintenu par MV.
# Les redirections ci-dessous permettent de garder des URLs propres
# tout en servant les fichiers HTML statiques.

[[redirects]]
  from = "/index1"
  to = "/index1.html"
  status = 200

[[redirects]]
  from = "/livraison"
  to = "/livraison.html"
  status = 200
