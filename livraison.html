<!--
  LidlVM
  Fichier : livraison.html
  Développement / maintenance : MV

  Notes :
  - interface pensée pour une utilisation rapide en magasin
  - garder les blocs simples à modifier si les besoins évoluent
  - éviter de charger la page avec des dépendances inutiles
-->

<!doctype html>
<html lang="fr">
<head>
  <!-- Métadonnées de base et styles globaux -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0050aa">
  <title>Livraison du jour | Lidl</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<!-- Début de l'interface visible -->
<body class="app-body">
<!-- Barre haute : identité du portail + retour accueil -->
<header class="topbar">
  <div class="topbar-inner">
    <img class="lidl-remote-logo" src="https://upload.wikimedia.org/wikipedia/commons/9/91/Lidl-Logo.svg" alt="Lidl">
    <div class="topbar-title">Espace Employés<small>Réception</small></div>
    <a class="back-link" href="index.html">← Accueil</a>
  </div>
</header>

<!-- Contenu principal de la page -->
<main class="container">
  <div class="page-heading">
    <h1>🚚 Livraison du jour</h1>
    <p>Renseignez les quantités réceptionnées puis générez le compte-rendu.</p>
  </div>

  <div id="deliveryCategories"></div>

  <section class="panel fl-panel">
    <div class="panel-header fl-panel-header">
      <div>
        <span class="fl-kicker">FRUITS & LÉGUMES</span>
        <strong>🥬 Livraison F&amp;L</strong>
      </div>
      <small>À renseigner séparément</small>
    </div>
    <div class="fl-grid">
      <label class="fl-field">
        <span class="fl-icon">📦</span>
        <span class="fl-copy"><strong>Nombre de palettes</strong><small>Palettes complètes F&amp;L</small></span>
        <input id="flPalettes" class="qty-input fl-input" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
      </label>
      <label class="fl-field">
        <span class="fl-icon">➗</span>
        <span class="fl-copy"><strong>Nombre de demi-palettes</strong><small>Demi-palettes F&amp;L</small></span>
        <input id="flHalfPalettes" class="qty-input fl-input" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
      </label>
    </div>
  </section>

  <section class="panel obs">
    <h2>📝 Observations</h2>
    <textarea id="observations" placeholder="Ajouter une observation…"></textarea>
    <div class="actions">
      <button class="btn btn-primary" id="generate">📄 Générer le compte-rendu</button>
      <button class="btn btn-secondary" id="reset">Réinitialiser</button>
    </div>
  </section>
</main>

<!-- Fenêtre de compte-rendu générée côté navigateur -->
<div class="report-modal" id="modal">
  <div class="report-box">
    <div id="deliveryExportArea" class="report-export-area">
      <div class="report-top">
        <div class="report-brand">
          <img class="lidl-remote-logo" src="https://upload.wikimedia.org/wikipedia/commons/9/91/Lidl-Logo.svg" alt="Lidl" crossorigin="anonymous">
          <div><span>RÉCEPTION MARCHANDISE</span><strong>Compte-rendu complet livraison</strong></div>
        </div>
        <button class="report-close" id="closeModal" aria-label="Fermer" data-html2canvas-ignore="true">×</button>
      </div>
      <div id="deliveryReportVisual"></div>
    </div>
    <div class="report-actions">
      <button class="btn btn-secondary" id="copyReport">📋 Copier le texte</button>
      <button class="btn btn-primary" id="downloadReport">⬇ Enregistrer en PNG</button>
    </div>
  </div>
</div>

<!-- Petit message de confirmation après une action -->
<div class="toast" id="toast"></div>

<!-- Scripts métier de la page -->

<!-- Le script métier est chargé en premier : les sélections restent disponibles même si le CDN PNG est indisponible. -->
<script src="assets/delivery.js"></script>
</body>
</html>
